<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Meu Perfil - OFFRAVE</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #13151f 0%, #08080a 70%);
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .profile-page-container {
      width: 100%;
      max-width: 500px;
      margin-top: 80px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-nav-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .brand-logo {
      font-family: 'Bebas Neue', cursive;
      font-size: 2rem;
      color: #e50914;
      text-decoration: none;
      letter-spacing: 1.5px;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .profile-card-glass {
      background: rgba(18, 19, 26, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .profile-avatar-large {
      width: 110px;
      height: 110px;
      border-radius: 20px;
      object-fit: cover;
      border: 3px solid #e50914;
      box-shadow: 0 8px 25px rgba(229, 9, 20, 0.3);
    }

    .profile-name-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
    }

    .profile-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .info-group {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .info-label {
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .info-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }

    /* BOTÃO DE SUPORTE INSTAGRAM */
    .btn-support-instagram {
      width: 100%;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #fff;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(220, 39, 67, 0.4);
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn-support-instagram:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }

    .btn-action-danger {
      width: 100%;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
      text-decoration: none;
    }

    .btn-action-danger:hover {
      background: rgba(239, 68, 68, 0.25);
    }
  </style>
</head>
<body>

  <div class="profile-page-container">
    <div class="top-nav-bar">
      <a class="brand-logo" href="index.html">OFFRAVE</a>
      <a class="btn-back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
    </div>

    <div class="profile-card-glass">
      <img class="profile-avatar-large" id="profileAvatar" src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="Avatar"/>
      <h1 class="profile-name-title" id="profileName">Carregando...</h1>
      <span class="profile-status-badge"><i class="fa-solid fa-shield-halved"></i> Conectado com Google</span>

      <div class="info-group" style="margin-top: 10px;">
        <span class="info-label">Nome da Conta</span>
        <span class="info-value" id="infoName">-</span>
      </div>

      <!-- BOTÃO DE SUPORTE VIA INSTAGRAM -->
      <a href="https://instagram.com/seu_usuario" target="_blank" class="btn-support-instagram">
        <i class="fa-brands fa-instagram" style="font-size: 1.2rem;"></i> Suporte via Instagram
      </a>

      <button class="btn-action-danger" onclick="logoutProfile()">
        <i class="fa-solid fa-right-from-bracket"></i> Trocar de Perfil / Sair
      </button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const name = localStorage.getItem('offrave_active_profile') || 'Usuário';
      const avatar = localStorage.getItem('offrave_active_avatar') || 'https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png';

      document.getElementById('profileName').textContent = name;
      document.getElementById('infoName').textContent = name;
      document.getElementById('profileAvatar').src = avatar;
    });

    function logoutProfile() {
      localStorage.removeItem('offrave_profile_selected');
      localStorage.removeItem('offrave_active_profile');
      localStorage.removeItem('offrave_active_avatar');
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>

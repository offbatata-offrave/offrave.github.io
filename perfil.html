<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meu Perfil</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .card { background: #111; padding: 20px; border-radius: 20px; text-align: center; width: 80%; }
    button { padding: 10px 20px; background: #e50914; color: #fff; border: none; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="userName">Carregando...</h1>
    <p id="userEmail">Carregando...</p>
    <br>
    <button onclick="logout()">Sair / Trocar Perfil</button>
  </div>

  <script>
    window.onload = function() {
      const name = localStorage.getItem('offrave_active_profile') || 'William';
      const email = localStorage.getItem('offrave_user_email') || 'anerosinw@gmail.com';
      
      document.getElementById('userName').textContent = name;
      document.getElementById('userEmail').textContent = email;
    };

    function logout() {
      localStorage.removeItem('offrave_profile_selected');
      localStorage.removeItem('offrave_active_profile');
      localStorage.removeItem('offrave_user_email');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>

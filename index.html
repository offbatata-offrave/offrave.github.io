<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OFFRAVE</title>
  
  <!-- Fontes Google & Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <!-- SDKs do Firebase Auth -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    /* --- RESET BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #13151f 0%, #08080a 70%);
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      padding-bottom: 120px;
      overflow-x: hidden;
    }

    /* --- LIQUID GLASS EFFECT --- */
    .glass-panel {
      background: rgba(18, 19, 26, 0.45);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* --- TELA DE SELEÇÃO DE PERFIL ESTILO NETFLIX --- */
    .profile-selector-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3000;
      background: radial-gradient(circle at center, rgba(229, 9, 20, 0.1) 0%, rgba(8, 8, 10, 0.98) 90%);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .profile-selector-overlay.hide {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .profile-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 2.8rem;
      letter-spacing: 1.5px;
      margin-bottom: 30px;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    .profiles-container {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 650px;
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.3s ease;
    }

    .profile-card:hover { transform: scale(1.08); }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      object-fit: cover;
      border: 3px solid transparent;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .google-avatar-box {
      width: 100px;
      height: 100px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #ea4335;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .profile-card:hover .profile-avatar,
    .profile-card:hover .google-avatar-box {
      border-color: #ffffff;
      box-shadow: 0 0 20px rgba(229, 9, 20, 0.8);
    }

    .profile-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #94a3b8;
      transition: color 0.3s ease;
    }

    .profile-card:hover .profile-name { color: #ffffff; }

    /* --- TOP HEADER --- */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, rgba(8, 8, 10, 0.98) 0%, rgba(8, 8, 10, 0.8) 70%, rgba(8, 8, 10, 0) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .brand-logo {
      font-family: 'Bebas Neue', cursive;
      font-size: 2rem;
      color: #e50914;
      text-decoration: none;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(229, 9, 20, 0.4);
    }

    .menu-toggle-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .menu-toggle-btn:hover {
      background: rgba(229, 9, 20, 0.8);
      border-color: rgba(229, 9, 20, 1);
    }

    /* --- CATEGORY TABS --- */
    .netflix-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .netflix-tabs::-webkit-scrollbar { display: none; }

    .tab-item {
      padding: 6px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .tab-item:hover, .tab-item.active {
      background: rgba(229, 9, 20, 0.85);
      color: #ffffff;
      border-color: rgba(229, 9, 20, 1);
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }

    /* --- HERO FEATURED BANNER --- */
    .hero-banner {
      position: relative;
      width: 100%;
      height: 55vh;
      min-height: 380px;
      margin-top: 50px;
      background: radial-gradient(circle at center, rgba(229, 9, 20, 0.15) 0%, rgba(8, 8, 10, 1) 90%),
                  url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 20px 30px 20px;
      text-align: center;
    }

    .hero-banner::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      background: linear-gradient(180deg, transparent 0%, #08080a 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 600px;
    }

    .hero-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 3.2rem;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      background: linear-gradient(180deg, #ffffff 0%, #d1d5db 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-play {
      background: #ffffff;
      color: #000000;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      border: none;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    /* --- SLIDER EM ALTA --- */
    .trending-section {
      max-width: 1200px;
      margin: 10px auto 30px auto;
      padding: 0 15px;
    }

    .trending-scroll {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 10px 0;
    }

    .trending-scroll::-webkit-scrollbar { display: none; }

    .trending-card {
      position: relative;
      flex: 0 0 auto;
      width: 180px;
      height: 220px;
      display: flex;
      align-items: flex-end;
      text-decoration: none;
    }

    .trending-number {
      font-size: 7.5rem;
      font-weight: 900;
      line-height: 0.8;
      color: #08080a;
      -webkit-text-stroke: 3px #52525b;
      position: absolute;
      left: -10px;
      bottom: -5px;
      z-index: 1;
      user-select: none;
      transition: -webkit-text-stroke 0.3s ease;
    }

    .trending-card:hover .trending-number { -webkit-text-stroke: 3px #e50914; }

    .trending-poster-box {
      position: absolute;
      right: 0;
      top: 0;
      width: 130px;
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
      z-index: 2;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      background: #12131a;
    }

    .trending-card:hover .trending-poster-box {
      transform: scale(1.05);
      border-color: rgba(229, 9, 20, 0.8);
      box-shadow: 0 8px 25px rgba(229, 9, 20, 0.3);
    }

    .trending-poster-img { width: 100%; height: 100%; object-fit: cover; }

    /* --- CATALOGO / GRID DE POSTS --- */
    .section-container {
      padding: 0 15px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 18px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
    }

    .poster-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 2 / 3;
      background-color: #12131a;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: block;
      text-decoration: none;
    }

    .poster-card:hover {
      transform: scale(1.05);
      border-color: rgba(229, 9, 20, 0.6);
      box-shadow: 0 8px 25px rgba(229, 9, 20, 0.3);
    }

    .poster-img { width: 100%; height: 100%; object-fit: cover; }

    .poster-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 10px 6px;
      background: linear-gradient(360deg, rgba(8, 8, 10, 0.95) 0%, transparent 100%);
    }

    .poster-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    /* --- MENU LATERAL --- */
    .side-menu-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1500;
      opacity: 0; visibility: hidden;
      transition: all 0.3s ease;
    }
    .side-menu-overlay.active { opacity: 1; visibility: visible; }

    .side-menu-popup {
      position: fixed;
      top: 0; right: -300px; width: 280px; height: 100%;
      z-index: 1600;
      background: rgba(18, 19, 26, 0.9);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      padding: 30px 20px;
      display: flex; flex-direction: column; gap: 20px;
      transition: right 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .side-menu-popup.active { right: 0; }

    .side-menu-header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .side-menu-title { font-family: 'Bebas Neue', cursive; font-size: 1.5rem; color: #e50914; letter-spacing: 1px; }
    .close-menu-btn { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; }

    .menu-options-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .menu-option-item a {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      border-radius: 12px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08); color: #ffffff;
      text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: all 0.3s ease;
    }
    .menu-option-item a:hover { background: rgba(229, 9, 20, 0.8); border-color: rgba(229, 9, 20, 1); transform: translateX(-4px); }
    .menu-option-item a i { font-size: 1.1rem; color: #e50914; }
    .menu-option-item a:hover i { color: #ffffff; }

    .active-profile-footer {
      margin-top: auto; padding: 12px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; align-items: center; gap: 12px;
    }
    .footer-profile-avatar { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; border: 2px solid rgba(229, 9, 20, 0.8); }
    .footer-profile-info { display: flex; flex-direction: column; }
    .footer-profile-label { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; }
    .footer-profile-name { font-size: 0.85rem; font-weight: 700; color: #ffffff; }

    /* --- MODAL DE BUSCA NETFLIX --- */
    .netflix-search-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
      background: rgba(8, 8, 10, 0.92); backdrop-filter: blur(25px);
      display: none; flex-direction: column; opacity: 0; transition: opacity 0.3s ease; padding: 20px;
    }
    .netflix-search-modal.active { display: flex; opacity: 1; }

    .search-modal-header { display: flex; align-items: center; gap: 15px; max-width: 900px; margin: 0 auto; width: 100%; padding-top: 10px; }
    .search-modal-input-container { position: relative; flex: 1; }
    .search-modal-input-container i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #e50914; font-size: 1.2rem; }
    .search-modal-input {
      width: 100%; padding: 15px 18px 15px 50px; border-radius: 30px;
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff; font-size: 1rem; outline: none;
    }
    .close-search-btn { background: rgba(255, 255, 255, 0.1); border: none; color: #fff; width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }
    .search-results-wrapper { max-width: 900px; margin: 30px auto 0 auto; width: 100%; overflow-y: auto; flex: 1; padding-bottom: 80px; }
    .search-status-title { font-size: 1.1rem; color: #94a3b8; margin-bottom: 20px; }

    /* --- NAVEGAÇÃO INFERIOR LIQUID GLASS --- */
    .bottom-nav {
      position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 30px); max-width: 450px; height: 62px; border-radius: 35px;
      display: flex; justify-content: space-around; align-items: center; z-index: 999;
      background: rgba(12, 13, 18, 0.45); backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: #94a3b8; text-decoration: none; font-size: 0.7rem; font-weight: 500;
      transition: color 0.3s; cursor: pointer; background: none; border: none;
    }
    .nav-item i { font-size: 1.15rem; }
    .nav-item:hover, .nav-item.active { color: #ffffff; }

    @media (min-width: 600px) {
      .movies-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
    }
  </style>
</head>
<body>

  <!-- SELETOR DE PERFIL -->
  <div class='profile-selector-overlay' id='profileOverlay'>
    <h1 class='profile-title'>QUEM ESTÁ ASSISTINDO?</h1>
    <div class='profiles-container'>
      <div class='profile-card' onclick='selectProfile("Principal", "https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png")'>
        <img class='profile-avatar' src='https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png'/>
        <span class='profile-name'>Principal</span>
      </div>
      <div class='profile-card' onclick='loginWithGoogleProfile()'>
        <div class='google-avatar-box'><i class='fa-brands fa-google'></i></div>
        <span class='profile-name'>Entrar com Google</span>
      </div>
      <div class='profile-card' onclick='selectProfile("Anônimo", "https://cdn-icons-png.flaticon.com/512/3069/3069172.png")'>
        <img class='profile-avatar' src='https://cdn-icons-png.flaticon.com/512/3069/3069172.png'/>
        <span class='profile-name'>Anônimo</span>
      </div>
    </div>
  </div>

  <!-- TOPO -->
  <header class='top-header'>
    <div class='header-top-row'>
      <a class='brand-logo' href='index.html'>OFFRAVE</a>
      <button class='menu-toggle-btn' id='openSideMenuBtn'><i class='fa-solid fa-bars'></i></button>
    </div>
    <div class='netflix-tabs'>
      <a class='tab-item active' href='index.html'><i class='fa-solid fa-border-all'></i> Tudo</a>
      <a class='tab-item' onclick='filterCategory("Séries")'><i class='fa-solid fa-tv'></i> Séries</a>
      <a class='tab-item' onclick='filterCategory("Filmes")'><i class='fa-solid fa-film'></i> Filmes</a>
    </div>
  </header>

  <!-- MENU LATERAL -->
  <div class='side-menu-overlay' id='sideMenuOverlay'></div>
  <aside class='side-menu-popup' id='sideMenuPopup'>
    <div class='side-menu-header'>
      <div style='display: flex; flex-direction: column;'>
        <span class='side-menu-title'>Menu OFFRAVE</span>
        <span style='font-size: 0.65rem; color: #e50914; letter-spacing: 1.5px; font-weight: 800;'>BY OFFBATATA</span>
      </div>
      <button class='close-menu-btn' id='closeSideMenuBtn'><i class='fa-solid fa-xmark'></i></button>
    </div>
    <ul class='menu-options-list'>
      <li class='menu-option-item'><a href='https://wa.me/' target='_blank'><i class='fa-solid fa-headset'></i><span>Suporte</span></a></li>
      <li class='menu-option-item'><a href='party.html'><i class='fa-solid fa-users'></i><span>OFF Party</span></a></li>
      <li class='menu-option-item'><a href='javascript:void(0);' onclick='resetProfileSelection()'><i class='fa-solid fa-user-gear'></i><span>Trocar Perfil</span></a></li>
    </ul>
    <div class='active-profile-footer'>
      <img class='footer-profile-avatar' id='footerProfileAvatar' src='https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png'/>
      <div class='footer-profile-info'>
        <span class='footer-profile-label'>Perfil Ativo</span>
        <span class='footer-profile-name' id='footerProfileName'>Principal</span>
      </div>
    </div>
  </aside>

  <!-- HERO -->
  <div class='hero-banner'>
    <div class='hero-content'>
      <h1 class='hero-title' id='heroTitle'>AVATAR AANG</h1>
      <div class='hero-buttons'>
        <a class='btn-play' id='heroBtn' href='#'><i class='fa-solid fa-play'></i> Assistir</a>
      </div>
    </div>
  </div>

  <!-- EM ALTA -->
  <section class='trending-section'>
    <h2 class='section-title'><i class='fa-solid fa-fire' style='color:#e50914;'></i> Em Alta no OFFRAVE</h2>
    <div class='trending-scroll' id='trendingSlider'></div>
  </section>

  <!-- CATÁLOGO -->
  <main class='section-container'>
    <h2 class='section-title' id='catalogCategoryTitle'><i class='fa-solid fa-layer-group'></i> Catálogo</h2>
    <div class='movies-grid' id='catalogGrid'>
      <!-- Carregado via JSON -->
    </div>
  </main>

  <!-- MODAL DE BUSCA -->
  <div class='netflix-search-modal' id='searchModal'>
    <div class='search-modal-header'>
      <div class='search-modal-input-container'>
        <i class='fa-solid fa-magnifying-glass'></i>
        <input class='search-modal-input' id='searchInput' placeholder='Digite o nome do filme ou série...' type='text'/>
      </div>
      <button class='close-search-btn' id='closeSearchBtn'><i class='fa-solid fa-xmark'></i></button>
    </div>
    <div class='search-results-wrapper'>
      <div class='search-status-title' id='searchStatusTitle'>Digite para começar a buscar...</div>
      <div class='movies-grid' id='searchResultsGrid'></div>
    </div>
  </div>

  <!-- BARRA INFERIOR -->
  <nav class='bottom-nav glass-panel'>
    <a class='nav-item active' href='index.html'><i class='fa-solid fa-house'></i><span>Início</span></a>
    <button class='nav-item' onclick='filterCategory("Séries")'><i class='fa-solid fa-tv'></i><span>Séries</span></button>
    <button class='nav-item' onclick='filterCategory("Filmes")'><i class='fa-solid fa-film'></i><span>Filmes</span></button>
    <a class='nav-item' href='party.html'><i class='fa-solid fa-users'></i><span>OFF Party</span></a>
    <button class='nav-item' id='openSearchBtn'><i class='fa-solid fa-magnifying-glass'></i><span>Buscar</span></button>
  </nav>

  <!-- SCRIPT ESTÁTICO -->
  <script>
    let allMovies = [];

    // Perfil
    const profileOverlay = document.getElementById('profileOverlay');
    const footerProfileName = document.getElementById('footerProfileName');
    const footerProfileAvatar = document.getElementById('footerProfileAvatar');

    function updateFooterProfile() {
      const savedName = localStorage.getItem('offrave_active_profile') || 'Principal';
      const savedAvatar = localStorage.getItem('offrave_active_avatar') || 'https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png';
      if(footerProfileName) footerProfileName.textContent = savedName;
      if(footerProfileAvatar) footerProfileAvatar.src = savedAvatar;
    }

    if (localStorage.getItem('offrave_profile_selected') === 'true') {
      profileOverlay.classList.add('hide');
      updateFooterProfile();
    } else {
      document.body.style.overflow = 'hidden';
    }

    function selectProfile(profileName, avatarUrl) {
      localStorage.setItem('offrave_profile_selected', 'true');
      localStorage.setItem('offrave_active_profile', profileName);
      localStorage.setItem('offrave_active_avatar', avatarUrl);
      updateFooterProfile();
      profileOverlay.classList.add('hide');
      document.body.style.overflow = 'auto';
    }

    function loginWithGoogleProfile() {
      if (typeof firebase === 'undefined') return alert('Firebase SDK carregando...');
      const provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider)
        .then(result => {
          const user = result.user;
          selectProfile(user.displayName, user.photoURL || 'https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png');
        })
        .catch(err => alert('Erro no login Google: ' + err.message));
    }

    function resetProfileSelection() {
      localStorage.removeItem('offrave_profile_selected');
      closeMenu();
      profileOverlay.classList.remove('hide');
      document.body.style.overflow = 'hidden';
    }

    // Carregar dados de filmes/séries locais (filmes.json)
    document.addEventListener('DOMContentLoaded', () => {
      fetch('filmes.json')
        .then(res => res.json())
        .then(data => {
          allMovies = data;
          renderCatalog(allMovies);
          renderTrending(allMovies);
        })
        .catch(() => {
          document.getElementById('catalogGrid').innerHTML = '<p style="color:#94a3b8;">Crie um arquivo <b>filmes.json</b> para exibir os títulos.</p>';
        });
    });

    function renderCatalog(movies) {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = '';
      movies.forEach(movie => {
        grid.innerHTML += `
          <a href="player.html?id=${movie.id}" class="poster-card">
            <img src="${movie.capa}" alt="${movie.titulo}" class="poster-img"/>
            <div class="poster-overlay">
              <div class="poster-title">${movie.titulo}</div>
            </div>
          </a>
        `;
      });
    }

    function renderTrending(movies) {
      const slider = document.getElementById('trendingSlider');
      slider.innerHTML = '';
      movies.slice(0, 10).forEach((movie, index) => {
        slider.innerHTML += `
          <a href="player.html?id=${movie.id}" class="trending-card">
            <span class="trending-number">${index + 1}</span>
            <div class="trending-poster-box">
              <img src="${movie.capa}" alt="${movie.titulo}" class="trending-poster-img"/>
            </div>
          </a>
        `;
      });
    }

    function filterCategory(category) {
      const title = document.getElementById('catalogCategoryTitle');
      title.innerHTML = `<i class='fa-solid fa-layer-group'></i> ${category}`;
      const filtered = allMovies.filter(m => m.categoria.toLowerCase() === category.toLowerCase());
      renderCatalog(filtered);
    }

    // Menu Lateral
    const openSideMenuBtn = document.getElementById('openSideMenuBtn');
    const closeSideMenuBtn = document.getElementById('closeSideMenuBtn');
    const sideMenuOverlay = document.getElementById('sideMenuOverlay');
    const sideMenuPopup = document.getElementById('sideMenuPopup');

    function openMenu() { updateFooterProfile(); sideMenuOverlay.classList.add('active'); sideMenuPopup.classList.add('active'); }
    function closeMenu() { sideMenuOverlay.classList.remove('active'); sideMenuPopup.classList.remove('active'); }

    if (openSideMenuBtn) openSideMenuBtn.addEventListener('click', openMenu);
    if (closeSideMenuBtn) closeSideMenuBtn.addEventListener('click', closeMenu);
    if (sideMenuOverlay) sideMenuOverlay.addEventListener('click', closeMenu);

    // Modal de Busca
    const openSearchBtn = document.getElementById('openSearchBtn');
    const closeSearchBtn = document.getElementById('closeSearchBtn');
    const searchModal = document.getElementById('searchModal');
    const searchInput = document.getElementById('searchInput');
    const searchResultsGrid = document.getElementById('searchResultsGrid');
    const searchStatusTitle = document.getElementById('searchStatusTitle');

    if (openSearchBtn) {
      openSearchBtn.addEventListener('click', () => {
        searchModal.classList.add('active');
        setTimeout(() => searchInput.focus(), 100);
        document.body.style.overflow = 'hidden';
      });
    }

    function closeSearch() {
      searchModal.classList.remove('active');
      document.body.style.overflow = 'auto';
      searchInput.value = '';
      searchResultsGrid.innerHTML = '';
      searchStatusTitle.textContent = 'Digite para começar a buscar...';
    }

    if (closeSearchBtn) closeSearchBtn.addEventListener('click', closeSearch);

    searchInput.addEventListener('input', function() {
      const q = this.value.toLowerCase().trim();
      if (q.length < 2) {
        searchResultsGrid.innerHTML = '';
        searchStatusTitle.textContent = 'Digite para começar a buscar...';
        return;
      }
      const results = allMovies.filter(m => m.titulo.toLowerCase().includes(q));
      searchResultsGrid.innerHTML = '';
      if (results.length === 0) {
        searchStatusTitle.textContent = `Nenhum resultado para "${q}"`;
        return;
      }
      searchStatusTitle.textContent = `Resultados para "${q}":`;
      results.forEach(movie => {
        searchResultsGrid.innerHTML += `
          <a href="player.html?id=${movie.id}" class="poster-card">
            <img src="${movie.capa}" alt="${movie.titulo}" class="poster-img"/>
            <div class="poster-overlay">
              <div class="poster-title">${movie.titulo}</div>
            </div>
          </a>
        `;
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Entrar - OFFRAVE</title>
  
  <!-- Fontes Google & Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <!-- SDKs do Firebase Auth -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: #08080a;
      color: #ffffff;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
    }

    /* BACKGROUND CINEMATOGRÁFICO COM DEGRADÊ */
    .auth-background {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(0deg, rgba(8,8,10,0.85) 0%, rgba(8,8,10,0.5) 50%, rgba(8,8,10,0.85) 100%),
                  url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=1920&q=80') no-repeat center center;
      background-size: cover;
      z-index: 1;
    }

    /* TOPO COM LOGO */
    .auth-header {
      position: absolute;
      top: 0; left: 0; width: 100%;
      padding: max(20px, env(safe-area-inset-top)) 25px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-family: 'Bebas Neue', cursive;
      font-size: 2.5rem;
      color: #e50914;
      text-decoration: none;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(229, 9, 20, 0.5);
    }

    .btn-back-home {
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      transition: background 0.2s;
    }
    .btn-back-home:hover { background: rgba(255, 255, 255, 0.2); }

    /* CONTAINER DO FORMULÁRIO (LIQUID GLASS) */
    .auth-container {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: rgba(18, 19, 26, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* ABAS DE NAVEGAÇÃO (ENTRAR / CRIAR CONTA) */
    .auth-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .auth-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .auth-tab-btn.active {
      background: #e50914;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }

    /* FORMULÁRIO */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .form-input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 14px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: #e50914;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
    }

    .btn-submit {
      background: #e50914;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
      box-shadow: 0 4px 20px rgba(229, 9, 20, 0.4);
      transition: transform 0.2s, background 0.2s;
    }
    .btn-submit:hover { background: #ff1f2a; transform: scale(1.02); }

    /* BOTÃO DE LOGIN COM GOOGLE */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #64748b;
      font-size: 0.8rem;
      margin: 5px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .divider::before { margin-right: .75em; }
    .divider::after { margin-left: .75em; }

    .btn-google {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s;
    }
    .btn-google:hover { background: rgba(255, 255, 255, 0.12); }
    .btn-google i { color: #ea4335; font-size: 1.1rem; }

    /* MENSAGEM DE ERRO/SUCESSO */
    .auth-message {
      font-size: 0.85rem;
      text-align: center;
      color: #f87171;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="auth-background"></div>

  <header class="auth-header">
    <a href="index.html" class="brand-logo">OFFRAVE</a>
    <a href="index.html" class="btn-back-home"><i class="fa-solid fa-house"></i> Início</a>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      
      <!-- ABAS -->
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">Entrar</button>
        <button class="auth-tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">Criar Conta</button>
      </div>

      <div class="auth-message" id="authMessage"></div>

      <!-- FORMULÁRIO DE LOGIN / CADASTRO -->
      <form class="auth-form" id="authForm" onsubmit="handleAuth(event)">
        
        <div class="form-group" id="nameGroup" style="display: none;">
          <label>Nome do Perfil</label>
          <input type="text" id="nameInput" class="form-input" placeholder="Seu nome"/>
        </div>

        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="emailInput" class="form-input" placeholder="seu@email.com" required/>
        </div>

        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required/>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Entrar</button>
      </form>

      <div class="divider">ou</div>

      <!-- LOGIN COM GOOGLE -->
      <button class="btn-google" onclick="loginWithGoogle()">
        <i class="fa-brands fa-google"></i> Continuar com Google
      </button>

    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCfmD2-gmj8p4yVuWyNmjMLfIv7vgH_SMU",
      authDomain: "offrave-party.firebaseapp.com",
      databaseURL: "https://offrave-party-default-rtdb.firebaseio.com",
      projectId: "offrave-party",
      storageBucket: "offrave-party.appspot.com",
      messagingSenderId: "351490904436",
      appId: "1:351490904436:web:fe43c11a9eb7de9b745c21"
    };

    if (typeof firebase !== 'undefined' && !firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    let currentMode = 'login'; // 'login' ou 'register'

    function switchTab(mode) {
      currentMode = mode;
      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabRegisterBtn = document.getElementById('tabRegisterBtn');
      const nameGroup = document.getElementById('nameGroup');
      const submitBtn = document.getElementById('submitBtn');
      const msg = document.getElementById('authMessage');

      msg.textContent = '';

      if (mode === 'login') {
        tabLoginBtn.classList.add('active');
        tabRegisterBtn.classList.remove('active');
        nameGroup.style.display = 'none';
        submitBtn.textContent = 'Entrar';
      } else {
        tabRegisterBtn.classList.add('active');
        tabLoginBtn.classList.remove('active');
        nameGroup.style.display = 'flex';
        submitBtn.textContent = 'Cadastrar';
      }
    }

    async function handleAuth(event) {
      event.preventDefault();
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      const name = document.getElementById('nameInput').value;
      const msg = document.getElementById('authMessage');

      msg.style.color = '#f87171';
      msg.textContent = 'Processando...';

      try {
        if (currentMode === 'register') {
          // Criar conta com Email e Senha
          const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
          const user = userCredential.user;
          
          const profileName = name || user.email.split('@')[0];
          localStorage.setItem('offrave_profile_selected', 'true');
          localStorage.setItem('offrave_active_profile', profileName);
          localStorage.setItem('offrave_active_avatar', 'https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png');

          window.location.href = 'index.html';
        } else {
          // Entrar com Email e Senha
          const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
          const user = userCredential.user;

          localStorage.setItem('offrave_profile_selected', 'true');
          localStorage.setItem('offrave_active_profile', user.displayName || user.email.split('@')[0]);
          localStorage.setItem('offrave_active_avatar', user.photoURL || 'https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png');

          window.location.href = 'index.html';
        }
      } catch (error) {
        if (error.code === 'auth/email-already-in-use') {
          msg.textContent = 'Este e-mail já está cadastrado.';
        } else if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
          msg.textContent = 'E-mail ou senha incorretos.';
        } else if (error.code === 'auth/weak-password') {
          msg.textContent = 'A senha deve ter pelo menos 6 caracteres.';
        } else {
          msg.textContent = error.message;
        }
      }
    }

    async function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await firebase.auth().signInWithPopup(provider);
        const user = result.user;

        localStorage.setItem('offrave_profile_selected', 'true');
        localStorage.setItem('offrave_active_profile', user.displayName || 'Usuário Google');
        localStorage.setItem('offrave_active_avatar', user.photoURL || 'https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png');

        window.location.href = 'index.html';
      } catch (error) {
        if (error.code !== 'auth/cancelled-popup-request') {
          alert('Erro no login com Google: ' + error.message);
        }
      }
    }
  </script>
</body>
</html>

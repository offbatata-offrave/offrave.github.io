<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OFF Party - OFFRAVE</title>
  
  <!-- Fontes Google & Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <!-- SDKs do Firebase (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <!-- API do YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(circle at top, #13151f 0%, #08080a 70%); background-attachment: fixed; color: #ffffff; min-height: 100vh; padding-bottom: 100px; overflow-x: hidden; }
    
    .glass-panel { background: rgba(18, 19, 26, 0.45); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
    
    /* TOPO */
    .top-header { position: fixed; top: 0; left: 0; width: 100%; z-index: 100; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(8, 8, 10, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .brand-logo { font-family: 'Bebas Neue', cursive; font-size: 2rem; color: #e50914; text-decoration: none; letter-spacing: 1.5px; text-shadow: 0 0 12px rgba(229, 9, 20, 0.4); }

    /* CONTAINER */
    .party-container { max-width: 900px; margin: 80px auto 20px auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .lobby-card { background: rgba(18, 19, 26, 0.75); border-radius: 20px; padding: 30px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
    .lobby-title { font-family: 'Bebas Neue', cursive; font-size: 2.5rem; color: #e50914; margin-bottom: 15px; }
    
    /* BOTÕES */
    .btn-party { padding: 12px 24px; border-radius: 12px; background: #e50914; color: #fff; font-weight: 700; border: none; cursor: pointer; transition: all 0.3s; }
    .btn-party:hover { background: #b80710; transform: translateY(-2px); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); }
    
    /* PLAYER SYNC */
    .room-view { display: none; flex-direction: column; gap: 20px; }
    .room-view.active { display: flex; }
    .video-sync-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.15); }
    #playerContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* CHAT E PAINÉIS */
    .panel-box { background: rgba(18, 19, 26, 0.6); border-radius: 14px; padding: 15px; border: 1px solid rgba(255, 255, 255, 0.1); height: 320px; display: flex; flex-direction: column; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
    
    /* BARRA INFERIOR */
    .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 450px; height: 62px; border-radius: 35px; display: flex; justify-content: space-around; align-items: center; z-index: 999; background: rgba(12, 13, 18, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; text-decoration: none; font-size: 0.7rem; font-weight: 500; cursor: pointer; }
    .nav-item.active { color: #ffffff; }

    /* MODAIS */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: #12131a; width: 100%; max-width: 480px; border-radius: 20px; padding: 25px; color: #fff; }
  </style>
</head>
<body>

  <header class='top-header'>
    <a class='brand-logo' href='index.html'>OFFRAVE</a>
    <span style='font-size: 0.8rem; color: #94a3b8;'>OFF Party (Sync Room)</span>
  </header>

  <div class='party-container'>
    <div class='lobby-card' id='lobbyCard'>
      <h1 class='lobby-title'>Assistir Junto</h1>
      <button class='btn-party' onclick='openCreateModal()'>Criar Nova Sala (ADM)</button>
      <div class='input-group'><input type='text' id='roomCodeInput' class='party-input' placeholder='Código da Sala...'/><button class='btn-party btn-secondary' onclick='joinRoomByCode()'>Entrar</button></div>
    </div>

    <div class='room-view' id='roomView'>
      <div class='room-header-bar'>
        <div id='currentRoomCode'></div>
        <button class='btn-party' onclick='leaveRoom()'>Sair</button>
      </div>
      <div class='video-sync-box'><div id='playerContainer'></div></div>
      <div class='panel-box'><div class='chat-messages' id='chatMessages'></div></div>
    </div>
  </div>

  <nav class='bottom-nav glass-panel'>
    <a class='nav-item' href='index.html'><i class='fa-solid fa-house'></i><span>Início</span></a>
    <a class='nav-item' href='index.html'><i class='fa-solid fa-film'></i><span>Filmes</span></a>
    <a class='nav-item active' href='party.html'><i class='fa-solid fa-users'></i><span>OFF Party</span></a>
  </nav>

  <script>
    // [Inserir aqui a lógica Firebase que você já possui]
    // A estrutura visual acima garante que as funções de createRoom(), 
    // joinRoom(), setupRoomInFirebase() e as Modais continuem funcionando 
    // exatamente como estavam no código anterior.
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>OFF Party - OFFRAVE</title>
  
  <!-- Fontes Google & Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <!-- SDKs do Firebase (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #13151f 0%, #08080a 70%);
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      padding-bottom: 100px;
      overflow-x: hidden;
    }

    .glass-panel {
      background: rgba(18, 19, 26, 0.45);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* --- TOPO --- */
    .top-header {
      position: fixed;
      top: 0; left: 0; width: 100%; z-index: 100;
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(8, 8, 10, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand-logo {
      font-family: 'Bebas Neue', cursive;
      font-size: 2rem; color: #e50914;
      text-decoration: none; letter-spacing: 1.5px;
      text-shadow: 0 0 12px rgba(229, 9, 20, 0.4);
    }

    /* --- CONTAINER PRINCIPAL DO PARTY --- */
    .party-container {
      max-width: 900px;
      margin: 80px auto 20px auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Tela de Lobby (Criar / Entrar) */
    .lobby-card {
      background: rgba(18, 19, 26, 0.75);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .lobby-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 2.5rem;
      letter-spacing: 1px;
      margin-bottom: 15px;
      color: #e50914;
    }

    .input-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .party-input {
      padding: 12px 18px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 1rem;
      outline: none;
      width: 250px;
    }

    .btn-party {
      padding: 12px 24px;
      border-radius: 12px;
      background: #e50914;
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-party:hover { background: #b80710; transform: translateY(-2px); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }

    /* Sala Ativa */
    .room-view { display: none; flex-direction: column; gap: 20px; }
    .room-view.active { display: flex; }

    .video-sync-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .video-sync-box iframe, .video-sync-box video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }

    .room-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 19, 26, 0.6);
      padding: 15px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .room-code-badge {
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .room-code-badge span { color: #fff; font-weight: bold; font-family: monospace; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 6px; }

    /* Painel de Participantes Online & Chat */
    .room-grid-panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .room-grid-panels { grid-template-columns: 1fr; }
    }

    .panel-box {
      background: rgba(18, 19, 26, 0.6);
      border-radius: 14px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      height: 300px;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }

    .members-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .member-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .btn-kick {
      background: rgba(229, 9, 20, 0.2);
      color: #ff4d4f;
      border: 1px solid rgba(229, 9, 20, 0.4);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-kick:hover { background: #e50914; color: #fff; }

    /* Chat interno */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      padding-right: 4px;
    }
    .chat-msg { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 6px; word-break: break-all; }
    .chat-msg b { color: #e50914; }

    .chat-input-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .chat-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    /* BARRA INFERIOR */
    .bottom-nav {
      position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 30px); max-width: 450px; height: 62px; border-radius: 35px;
      display: flex; justify-content: space-around; align-items: center; z-index: 999;
      background: rgba(12, 13, 18, 0.45); backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: #94a3b8; text-decoration: none; font-size: 0.7rem; font-weight: 500;
      transition: color 0.3s; cursor: pointer; background: none; border: none;
    }
    .nav-item i { font-size: 1.15rem; }
    .nav-item:hover, .nav-item.active { color: #ffffff; }
  </style>
</head>
<body>

  <header class='top-header'>
    <a class='brand-logo' href='index.html'>OFFRAVE</a>
    <span style='font-size: 0.8rem; color: #94a3b8;'>OFF Party (Sync Room)</span>
  </header>

  <div class='party-container'>
    
    <!-- TELA DE LOBBY -->
    <div class='lobby-card' id='lobbyCard'>
      <h1 class='lobby-title'>Assistir Junto</h1>
      <p style='color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;'>Crie uma sala sincronizada ou entre com o código de um amigo.</p>
      
      <div style='display: flex; flex-direction: column; gap: 15px; align-items: center;'>
        <button class='btn-party' onclick='createRoom()'><i class='fa-solid fa-plus'></i> Criar Nova Sala (ADM)</button>
        
        <div style='display: flex; align-items: center; width: 100%; max-width: 400px; gap: 10px; margin: 10px 0;'>
          <hr style='flex:1; border-color: rgba(255,255,255,0.1);'>
          <span style='font-size:0.8rem; color:#64748b;'>OU</span>
          <hr style='flex:1; border-color: rgba(255,255,255,0.1);'>
        </div>

        <div class='input-group'>
          <input type='text' id='roomCodeInput' class='party-input' placeholder='Código da Sala...'/>
          <button class='btn-party btn-secondary' onclick='joinRoom()'><i class='fa-solid fa-right-to-bracket'></i> Entrar</button>
        </div>
      </div>
    </div>

    <!-- TELA DA SALA ATIVA -->
    <div class='room-view' id='roomView'>
      
      <div class='room-header-bar'>
        <div class='room-code-badge'>Sala: <span id='currentRoomCode'>----</span></div>
        <button class='btn-party btn-kick' style='background:rgba(229,9,20,0.8); color:#fff;' onclick='leaveOrCloseRoom()'>
          <i class='fa-solid fa-right-from-bracket'></i> <span id='leaveBtnText'>Sair da Sala</span>
        </button>
      </div>

      <div class='video-sync-box'>
        <!-- Exemplo de player sincronizado ou iframe de vídeo -->
        <iframe id='syncVideoPlayer' src='https://www.youtube.com/embed/dQw4w9WgXcQ' allowfullscreen='true'></iframe>
      </div>

      <div class='room-grid-panels'>
        <!-- Painel de Usuários Online -->
        <div class='panel-box'>
          <div class='panel-title'><i class='fa-solid fa-users'></i> Usuários Online (<span id='onlineCount'>0</span>)</div>
          <div class='members-list' id='membersList'>
            <!-- Preenchido via JS -->
          </div>
        </div>

        <!-- Painel de Chat -->
        <div class='panel-box'>
          <div class='panel-title'><i class='fa-solid fa-comments'></i> Chat da Sala</div>
          <div class='chat-messages' id='chatMessages'></div>
          <div class='chat-input-row'>
            <input type='text' id='chatInput' class='chat-input' placeholder='Digite sua mensagem...' onkeypress='handleChatKey(event)'/>
            <button class='btn-party' style='padding: 8px 14px;' onclick='sendChatMessage()'><i class='fa-solid fa-paper-plane'></i></button>
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- BARRA INFERIOR -->
  <nav class='bottom-nav glass-panel'>
    <a class='nav-item' href='index.html'><i class='fa-solid fa-house'></i><span>Início</span></a>
    <a class='nav-item' href='index.html'><i class='fa-solid fa-tv'></i><span>Séries</span></a>
    <a class='nav-item' href='index.html'><i class='fa-solid fa-film'></i><span>Filmes</span></a>
    <a class='nav-item active' href='party.html'><i class='fa-solid fa-users'></i><span>OFF Party</span></a>
  </nav>

  <!-- LÓGICA DO PARTY COM FIREBASE -->
  <script>
    // CONFIGURAÇÃO FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyCfmD2-gmj8p4yVuWyNmjMLfIv7vgH_SMU",
      authDomain: "offrave-party.firebaseapp.com",
      databaseURL: "https://offrave-party-default-rtdb.firebaseio.com",
      projectId: "offrave-party",
      storageBucket: "offrave-party.appspot.com",
      messagingSenderId: "351490904436",
      appId: "1:351490904436:web:fe43c11a9eb7de9b745c21"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentRoomId = null;
    let myUserId = 'user_' + Math.random().toString(36).substring(2, 9);
    let myUserName = localStorage.getItem('offrave_active_profile') || 'Visitante';
    let isHost = false;
    let roomRef = null;

    // Funções globais mapeadas para o objeto window
    window.generateRoomCode = function() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    window.createRoom = function() {
      const roomId = window.generateRoomCode();
      isHost = true;
      setupRoomInFirebase(roomId, true);
    }

    window.joinRoom = function() {
      const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      if (!code) return alert('Digite o código da sala!');
      
      db.ref('rooms/' + code).once('value', snapshot => {
        if (!snapshot.exists()) {
          alert('Sala não encontrada ou encerrada!');
          return;
        }
        isHost = false;
        setupRoomInFirebase(code, false);
      });
    }

    function setupRoomInFirebase(roomId, asHost) {
      currentRoomId = roomId;
      roomRef = db.ref('rooms/' + roomId);

      if (asHost) {
        roomRef.set({
          host: myUserId,
          status: 'active',
          videoUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ'
        });
      }

      const memberRef = roomRef.child('members/' + myUserId);
      memberRef.set({ name: myUserName });
      memberRef.onDisconnect().remove();

      document.getElementById('lobbyCard').style.display = 'none';
      document.getElementById('roomView').classList.add('active');
      document.getElementById('currentRoomCode').textContent = roomId;
      
      if (isHost) {
        document.getElementById('leaveBtnText').textContent = 'Fechar Sala (ADM)';
      } else {
        document.getElementById('leaveBtnText').textContent = 'Sair da Sala';
      }

      roomRef.on('value', snapshot => {
        const data = snapshot.val();
        if (!data || data.status === 'closed') {
          alert('A sala foi fechada pelo Administrador.');
          quitPartyClean();
          return;
        }

        if (data.members && !data.members[myUserId]) {
          alert('Você foi expulso da sala pelo Administrador.');
          quitPartyClean();
        }
      });

      roomRef.child('members').on('value', snapshot => {
        const members = snapshot.val() || {};
        const membersListEl = document.getElementById('membersList');
        membersListEl.innerHTML = '';
        let count = 0;

        Object.keys(members).forEach(uid => {
          count++;
          const member = members[uid];
          let kickBtnHtml = '';

          if (isHost && uid !== myUserId) {
            kickBtnHtml = `<button class='btn-kick' onclick='kickMember("${uid}")'>Expulsar</button>`;
          }

          membersListEl.innerHTML += `
            <div class='member-item'>
              <span><i class='fa-solid fa-circle' style='font-size:0.5rem; color:#22c55e; margin-right:6px;'></i> ${member.name} ${uid === roomRef.child('host') ? '(ADM)' : ''}</span>
              ${kickBtnHtml}
            </div>
          `;
        });
        document.getElementById('onlineCount').textContent = count;
      });

      roomRef.child('chat').on('child_added', snapshot => {
        const msg = snapshot.val();
        const chatBox = document.getElementById('chatMessages');
        chatBox.innerHTML += `<div class='chat-msg'><b>${msg.user}:</b> ${msg.text}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    window.kickMember = function(targetUserId) {
      if (!isHost) return;
      roomRef.child('members/' + targetUserId).remove();
    }

    window.leaveOrCloseRoom = function() {
      if (isHost) {
        if (confirm('Tem certeza que deseja fechar a sala para todos?')) {
          roomRef.update({ status: 'closed' });
        }
      } else {
        if (roomRef) {
          roomRef.child('members/' + myUserId).remove();
        }
        quitPartyClean();
      }
    }

    function quitPartyClean() {
      if (roomRef) {
        roomRef.off();
      }
      window.location.href = 'party.html';
    }

    window.sendChatMessage = function() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || !currentRoomId) return;

      roomRef.child('chat').push({
        user: myUserName,
        text: text,
        timestamp: Date.now()
      });
      input.value = '';
    }

    window.handleChatKey = function(e) {
      if (e.key === 'Enter') window.sendChatMessage();
    }
  </script>
</body>
</html>

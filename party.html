<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>OFF Party - Assistir Junto</title>
  
  <!-- Fontes & Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background-color: #08080a;
      height: 100%;
    }

    body {
      background-color: #08080a;
      background: radial-gradient(circle at top, #13151f 0%, #08080a 70%);
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      padding-bottom: 120px;
    }

    .party-container {
      max-width: 600px;
      margin: 0 auto;
      padding: max(25px, env(safe-area-inset-top)) 15px 40px 15px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* CARD ESTILO NETFLIX / LIQUID GLASS */
    .glass-card {
      background: rgba(18, 19, 26, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 15px;
    }

    /* BOTÕES DE AÇÃO ESTILO NETFLIX */
    .btn-action-row {
      display: flex;
      gap: 12px;
    }

    .btn-action {
      flex: 1;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    /* Vermelho clássico Netflix para criar sala */
    .btn-netflix-red {
      background: #e50914;
      color: #fff;
      box-shadow: 0 4px 20px rgba(229, 9, 20, 0.4);
    }
    .btn-netflix-red:hover { background: #ff1f2a; transform: scale(1.02); }

    /* Estilo escuro translúcido elegante para entrar com código */
    .btn-netflix-dark {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .btn-netflix-dark:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.02); }

    .active-rooms-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      max-height: 280px;
      overflow-y: auto;
    }

    .room-item-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .room-item-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
    .room-item-name { font-weight: 700; font-size: 0.95rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .room-item-meta { font-size: 0.75rem; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
    .room-item-code { color: #e50914; font-weight: 700; }

    .btn-join-direct {
      background: #e50914;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .no-rooms-msg { font-size: 0.85rem; color: #64748b; text-align: center; padding: 15px 0; font-style: italic; }

    /* BARRA INFERIOR LIQUID GLASS TRANSPARENTE */
    .bottom-nav {
      position: fixed;
      bottom: max(15px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 450px;
      height: 62px;
      border-radius: 35px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 2000;
      background: rgba(18, 19, 26, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.2s;
    }
    .nav-item i { font-size: 1.15rem; }
    .nav-item.active { color: #e50914; }

    /* MODAL DE BLOQUEIO DE LOGIN (ESTILO NETFLIX) */
    .login-lock-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 4000;
      background: rgba(8, 8, 10, 0.88);
      backdrop-filter: blur(15px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-lock-overlay.active { display: flex; }
    .login-lock-card {
      width: 100%;
      max-width: 400px;
      background: rgba(18, 19, 26, 0.85);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(229, 9, 20, 0.4);
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .login-lock-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 2.4rem;
      color: #fff;
      letter-spacing: 1.5px;
    }
    .login-lock-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- MODAL DE RESTRIÇÃO -->
  <div class="login-lock-overlay" id="loginLockModal">
    <div class="login-lock-card">
      <div style="font-size: 3.2rem; color: #e50914; margin-bottom: 5px;"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <h2 class="login-lock-title">VOCÊ AINDA NÃO LOGOU</h2>
      <p class="login-lock-desc">Acesso restrito! Para entrar na OFF Party, é necessário fazer login com sua conta.</p>
      
      <a href="login.html" class="btn-action btn-netflix-red" style="margin-top: 10px; text-decoration: none;">
        <i class="fa-solid fa-right-to-bracket"></i> FAZER LOGIN / CADASTRAR
      </a>
    </div>
  </div>

  <div class="party-container">
    <div class="glass-card" id="activeRoomsCard">
      <h2 class="card-title"><i class="fa-solid fa-tower-broadcast" style="color: #e50914;"></i> Salas Ativas</h2>
      <p class="card-subtitle">Transmissões ao vivo acontecendo agora</p>
      <div class="active-rooms-list" id="activeRoomsList"></div>
    </div>
    
    <div class="btn-action-row">
      <button class="btn-action btn-netflix-red" onclick="alert('Criar sala em desenvolvimento')">
        <i class="fa-solid fa-plus-circle"></i> CRIAR SALA
      </button>
      <button class="btn-action btn-netflix-dark" onclick="alert('Entrar em desenvolvimento')">
        <i class="fa-solid fa-key"></i> ENTRAR COM CÓDIGO
      </button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i><span>Início</span></a>
    <a class="nav-item active" href="party.html"><i class="fa-solid fa-users"></i><span>OFF Party</span></a>
  </nav>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const isProfileSelected = localStorage.getItem('offrave_profile_selected') === 'true';
      const activeProfile = localStorage.getItem('offrave_active_profile');
      
      if (!isProfileSelected || activeProfile === 'Anônimo' || !activeProfile) {
        document.getElementById('loginLockModal').classList.add('active');
      }
    });
  </script>
</body>
</html>

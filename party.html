<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>OFF Party - Assistir Junto</title>
  
  <!-- Fontes & Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <!-- API do YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #13151f 0%, #08080a 70%);
      background-attachment: fixed;
      color: #ffffff;
      padding-bottom: 120px;
    }

    .party-container {
      max-width: 600px;
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 15px 40px 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .glass-card {
      background: rgba(18, 19, 26, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .card-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .card-subtitle { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }

    .party-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 12px;
    }

    .btn-action-row { display: flex; gap: 10px; }

    .btn-action {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-gold { background: #f59e0b; color: #000; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3); }
    .btn-green { background: #10b981; color: #000; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3); }
    .btn-purple { background: #6366f1; color: #fff; box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3); }
    .btn-action:hover { transform: scale(1.02); }

    .active-rooms-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      max-height: 280px;
      overflow-y: auto;
    }

    .room-item-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .room-item-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
    .room-item-name { font-weight: 700; font-size: 0.95rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .room-item-meta { font-size: 0.75rem; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
    .room-item-code { color: #f59e0b; font-weight: 700; }

    .btn-join-direct { background: #10b981; color: #000; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }

    .no-rooms-msg { font-size: 0.85rem; color: #64748b; text-align: center; padding: 15px 0; font-style: italic; }

    /* BARRA INFERIOR */
    .bottom-nav {
      position: fixed; bottom: max(15px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      width: calc(100% - 30px); max-width: 450px; height: 62px; border-radius: 35px;
      display: flex; justify-content: space-around; align-items: center; z-index: 2000;
      background: rgba(18, 19, 26, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; text-decoration: none; font-size: 0.7rem; font-weight: 600; cursor: pointer; background: none; border: none; }
    .nav-item.active { color: #f59e0b; }

    /* MODAL DE BLOQUEIO DE LOGIN */
    .login-lock-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 4000;
      background: rgba(8, 8, 10, 0.85); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .login-lock-overlay.active { display: flex; }
    .login-lock-card {
      width: 100%; max-width: 400px; background: rgba(18, 19, 26, 0.65); border: 1px solid rgba(229, 9, 20, 0.4);
      border-radius: 24px; padding: 30px; text-align: center; display: flex; flex-direction: column; gap: 15px;
    }
    .login-lock-title { font-family: 'Bebas Neue', cursive; font-size: 2.2rem; color: #fff; }
    .login-lock-desc { font-size: 0.9rem; color: #94a3b8; }
  </style>
</head>
<body>

  <!-- MODAL DE RESTRIÇÃO -->
  <div class="login-lock-overlay" id="loginLockModal">
    <div class="login-lock-card">
      <div style="font-size: 3rem; color: #e50914;"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <h2 class="login-lock-title">VOCÊ AINDA NÃO LOGOU</h2>
      <p class="login-lock-desc">Acesso restrito! Para entrar na OFF Party, é necessário fazer login com sua conta na página inicial.</p>
      <a href="index.html" class="btn-action btn-gold" style="text-decoration: none;">
        <i class="fa-solid fa-arrow-left"></i> VOLTAR E FAZER LOGIN
      </a>
    </div>
  </div>

  <div class="party-container">
    <div class="glass-card" id="activeRoomsCard">
      <h2 class="card-title"><i class="fa-solid fa-tower-broadcast" style="color: #e50914;"></i> Salas Ativas</h2>
      <div class="active-rooms-list" id="activeRoomsList"></div>
    </div>
    
    <div class="btn-action-row">
      <button class="btn-action btn-gold" onclick="alert('Criar sala em desenvolvimento')">CRIAR SALA</button>
      <button class="btn-action btn-green" onclick="alert('Entrar em desenvolvimento')">ENTRAR COM CÓDIGO</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i><span>Início</span></a>
    <a class="nav-item active" href="party.html"><i class="fa-solid fa-users"></i><span>OFF Party</span></a>
  </nav>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // REGRA: Acesso apenas se logado (qualquer perfil exceto Anônimo ou vazio)
      const isProfileSelected = localStorage.getItem('offrave_profile_selected') === 'true';
      const activeProfile = localStorage.getItem('offrave_active_profile');
      
      // Bloqueia se não tiver login ou se o perfil for "Anônimo"
      if (!isProfileSelected || activeProfile === 'Anônimo' || !activeProfile) {
        document.getElementById('loginLockModal').classList.add('active');
      }
    });
  </script>
</body>
</html>

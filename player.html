<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>OFFRAVE - Assistir</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #08080a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 900px;
      width: 100%;
      margin: 0 auto 15px auto;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      text-decoration: none;
    }

    .movie-main-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.8rem;
      letter-spacing: 1px;
      color: #fff;
      text-align: center;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 15px;
    }

    /* PLAYER CONTAINER ESTILO NETFLIX */
    .netflix-player-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .netflix-video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .youtube-iframe-box {
      width: 100%;
      height: 100%;
      display: none;
    }
    .youtube-iframe-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .movie-details-box {
      max-width: 900px;
      width: 100%;
      margin: 20px auto 0 auto;
      background: rgba(18, 19, 26, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .movie-category-tag {
      font-size: 0.75rem;
      font-weight: 800;
      color: #e50914;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .movie-synopsis {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="player-header">
    <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
    <h1 class="movie-main-title" id="playerMovieTitle">Carregando Filme...</h1>
    <div style="width: 40px;"></div> <!-- Espaçador para centralizar o título -->
  </div>

  <!-- PLAYER -->
  <div class="netflix-player-container" id="netflixContainer">
    <video class="netflix-video" id="netflixVideo" controls playsinline preload="auto">
      <source id="videoSource" src="" type="video/mp4"/>
      Seu navegador não suporta reprodução de vídeo.
    </video>

    <div class="youtube-iframe-box" id="youtubePlayerBox">
      <iframe id="youtubeIframe" src="" allowfullscreen></iframe>
    </div>
  </div>

  <div class="movie-details-box">
    <span class="movie-category-tag" id="movieCategoryTag">OFFRAVE PLAYER</span>
    <p class="movie-synopsis" id="movieSynopsis">Aproveite sua sessão com alta qualidade no OFFRAVE.</p>
  </div>

  <script>
    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const movieData = localStorage.getItem('offrave_selected_movie');

      if (!movieData) {
        alert('Nenhum filme selecionado!');
        window.location.href = 'index.html';
        return;
      }

      const movie = JSON.parse(movieData);

      // Preenche os textos da interface
      document.getElementById('playerMovieTitle').textContent = movie.titulo || 'Filme OFFRAVE';
      document.getElementById('movieCategoryTag').textContent = `CATEGORIA • ${movie.categoria || 'FILME'}`;
      document.getElementById('movieSynopsis').textContent = movie.sinopse || 'Nenhuma sinopse disponível para este título.';

      const videoUrl = movie.link || movie.videoUrl || '';
      const ytId = extractYouTubeId(videoUrl);

      const videoElement = document.getElementById('netflixVideo');
      const videoSource = document.getElementById('videoSource');
      const youtubeBox = document.getElementById('youtubePlayerBox');
      const youtubeIframe = document.getElementById('youtubeIframe');

      if (ytId) {
        // Se for link do YouTube
        videoElement.style.display = 'none';
        videoElement.pause();
        youtubeBox.style.display = 'block';
        youtubeIframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
      } else if (videoUrl) {
        // Se for link direto (MP4 / Link de Servidor)
        youtubeBox.style.display = 'none';
        videoElement.style.display = 'block';
        videoSource.src = videoUrl;
        videoElement.load();
        videoElement.play().catch(e => {
          console.log("Autoplay bloqueado pelo navegador, aguardando interação.", e);
        });
      } else {
        alert('Link de vídeo inválido ou indisponível.');
      }
    });
  </script>
</body>
</html>

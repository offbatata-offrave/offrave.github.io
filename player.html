<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>OFFRAVE - Assistir</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: #08080a;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* TOPO FLUTUANTE */
    .player-top-bar {
      position: fixed;
      top: 0; left: 0; width: 100%;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: linear-gradient(180deg, rgba(8,8,10,0.85) 0%, transparent 100%);
      z-index: 1000;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn-back:hover { background: rgba(229, 9, 20, 0.8); }

    .player-movie-title-top {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.8rem;
      letter-spacing: 1px;
      color: #fff;
    }

    /* CONTAINER PRINCIPAL DO PLAYER */
    .player-wrapper {
      width: 100%;
      max-width: 1000px;
      margin: 90px auto 30px auto;
      padding: 0 15px;
    }

    .netflix-player-container {
      position: relative;
      width: 100%;
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
      box-shadow: 0 15px 50px rgba(0,0,0,0.8);
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .netflix-video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* LOADER */
    .dots-loader {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: none; align-items: center; gap: 12px;
      z-index: 30; pointer-events: none;
    }
    .netflix-player-container.is-loading .dots-loader { display: flex !important; }

    .dot {
      width: 16px; height: 16px; background-color: #E50914; border-radius: 50%;
      animation: dotPulse 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    .dot:nth-child(3) { animation-delay: 0s; }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.3); opacity: 0.3; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    /* BOTÃO PLAY CENTRAL */
    .central-play-button {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 75px; height: 75px;
      background-color: #E50914; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 20; border: none; outline: none;
      box-shadow: 0 0 30px rgba(229, 9, 20, 0.6);
      transition: transform 0.2s;
    }
    .central-play-button:hover { transform: translate(-50%, -50%) scale(1.1); }
    .central-play-button svg { fill: #fff; width: 38px; height: 38px; margin-left: 4px; }

    .netflix-player-container.is-playing .central-play-button,
    .netflix-player-container.is-loading .central-play-button {
      opacity: 0 !important; pointer-events: none !important;
    }

    /* CONTROLES INFERIORES DO VÍDEO */
    .netflix-controls {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 50%, transparent 100%);
      padding: 20px 15px 12px 15px;
      opacity: 0; transition: opacity 0.3s ease;
      display: flex; flex-direction: column; gap: 10px; z-index: 10;
    }
    .netflix-player-container:hover .netflix-controls { opacity: 1; }

    .progress-bar-container {
      width: 100%; height: 6px; background: rgba(255, 255, 255, 0.25);
      cursor: pointer; border-radius: 4px; position: relative;
    }
    .progress-bar-filled {
      height: 100%; background-color: #E50914; width: 0%; border-radius: 4px; position: relative;
    }
    .progress-bar-thumb {
      position: absolute; right: -7px; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; background-color: #E50914; border-radius: 50%; pointer-events: none;
    }

    .controls-row { display: flex; justify-content: space-between; align-items: center; color: #fff; }
    .controls-left, .controls-right { display: flex; align-items: center; gap: 15px; }

    .netflix-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
    .netflix-btn svg { fill: #fff; width: 20px; height: 20px; transition: transform 0.2s; }
    .netflix-btn:hover svg { transform: scale(1.15); fill: #e50914; }

    .time-display { font-size: 13px; color: #cbd5e1; user-select: none; font-weight: 500; }

    /* INFORMAÇÕES ABAIXO DO VÍDEO */
    .movie-details-card {
      margin-top: 20px;
      background: rgba(18, 19, 26, 0.5);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .movie-main-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
    }

    .movie-meta-row {
      display: flex;
      gap: 15px;
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .movie-synopsis {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- TOPO -->
  <header class="player-top-bar">
    <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
    <span class="player-movie-title-top" id="topNavTitle">OFFRAVE PLAYER</span>
  </header>

  <!-- PLAYER WRAPPER -->
  <div class="player-wrapper">
    <div class="netflix-player-container" id="netflixContainer">

      <video class="netflix-video" id="netflixVideo" playsinline preload="auto" webkit-playsinline>
        <source id="videoSource" src="" type="video/mp4"/>
      </video>

      <div class="dots-loader" id="dotsLoader">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <button aria-label="Play" class="central-play-button" id="centralPlayBtn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
      </button>

      <div class="netflix-controls">
        <div class="progress-bar-container" id="progressContainer">
          <div class="progress-bar-filled" id="progressBar">
            <div class="progress-bar-thumb"></div>
          </div>
        </div>

        <div class="controls-row">
          <div class="controls-left">
            <button aria-label="Play/Pause" class="netflix-btn" id="playBtn">
              <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
              <svg id="pauseIcon" style="display: none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
            </button>
            
            <button aria-label="Voltar 10s" class="netflix-btn" id="rewindBtn">
              <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"></path></svg>
            </button>
            
            <button aria-label="Avançar 10s" class="netflix-btn" id="forwardBtn">
              <svg viewBox="0 0 24 24"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.16-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"></path></svg>
            </button>
            
            <button aria-label="Mute/Unmute" class="netflix-btn" id="muteBtn">
              <svg id="volumeUpIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path></svg>
              <svg id="volumeOffIcon" style="display: none;" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"></path></svg>
            </button>
            
            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
          </div>
          
          <div class="controls-right">
            <button aria-label="Tela Cheia" class="netflix-btn" id="fullscreenBtn">
              <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"></path></svg>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- INFORMAÇÕES DO FILME -->
    <div class="movie-details-card">
      <h1 class="movie-main-title" id="movieTitle">Carregando...</h1>
      <div class="movie-meta-row">
        <span id="movieCategory">Categoria</span>
        <span>•</span>
        <span style="color: #10b981; font-weight: 700;">100% HD</span>
      </div>
      <p class="movie-synopsis" id="movieSynopsis">Buscando sinopse do título selecionado...</p>
    </div>
  </div>

  <script>
    const TMDB_KEY = '6f5b9460f7c6019e38e8d79c2f5b4cf0';

    const video = document.getElementById('netflixVideo');
    const container = document.getElementById('netflixContainer');
    const videoSource = document.getElementById('videoSource');
    const centralPlayBtn = document.getElementById('centralPlayBtn');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const muteBtn = document.getElementById('muteBtn');
    const volumeUpIcon = document.getElementById('volumeUpIcon');
    const volumeOffIcon = document.getElementById('volumeOffIcon');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const timeDisplay = document.getElementById('timeDisplay');

    function showLoader() { container.classList.add('is-loading'); }
    function hideLoader() { container.classList.remove('is-loading'); }

    video.addEventListener('playing', hideLoader);
    video.addEventListener('canplay', hideLoader);
    video.addEventListener('pause', hideLoader);
    video.addEventListener('waiting', showLoader);

    function togglePlay() {
      if (video.paused) { video.play(); } else { video.pause(); }
    }

    centralPlayBtn.addEventListener('click', togglePlay);
    playBtn.addEventListener('click', togglePlay);

    video.addEventListener('play', () => {
      container.classList.add('is-playing');
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
    });

    video.addEventListener('pause', () => {
      container.classList.remove('is-playing');
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    });

    rewindBtn.addEventListener('click', () => { video.currentTime -= 10; });
    forwardBtn.addEventListener('click', () => { video.currentTime += 10; });

    progressContainer.addEventListener('click', (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      video.currentTime = pos * video.duration;
    });

    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      volumeUpIcon.style.display = video.muted ? 'none' : 'block';
      volumeOffIcon.style.display = video.muted ? 'block' : 'none';
    });

    video.addEventListener('timeupdate', () => {
      if (!video.duration) return;
      const percentage = (video.currentTime / video.duration) * 100;
      progressBar.style.width = `${percentage}%`;

      let curMin = Math.floor(video.currentTime / 60);
      let curSec = Math.floor(video.currentTime % 60);
      let durMin = Math.floor(video.duration / 60);
      let durSec = Math.floor(video.duration % 60);

      if (curSec < 10) curSec = `0${curSec}`;
      if (durSec < 10) durSec = `0${durSec}`;

      timeDisplay.innerText = `${curMin}:${curSec} / ${durMin}:${durSec}`;
    });

    fullscreenBtn.addEventListener('click', () => {
      if (video.webkitEnterFullscreen) { video.webkitEnterFullscreen(); return; }
      if (!document.fullscreenElement) {
        container.requestFullscreen ? container.requestFullscreen() : container.webkitRequestFullscreen();
      } else {
        document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen();
      }
    });

    // CARREGAR DADOS DO FILME PELO ID PASSADO NA URL
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const movieId = urlParams.get('id');

      if (!movieId) {
        alert('Nenhum filme selecionado!');
        window.location.href = 'index.html';
        return;
      }

      try {
        const res = await fetch('filmes.json');
        const movies = await res.json();
        const movie = movies.find(m => m.id == movieId);

        if (!movie) {
          alert('Filme não encontrado.');
          window.location.href = 'index.html';
          return;
        }

        document.getElementById('topNavTitle').textContent = movie.titulo;
        document.getElementById('movieTitle').textContent = movie.titulo;
        document.getElementById('movieCategory').textContent = movie.categoria || 'Filme';
        document.getElementById('movieSynopsis').textContent = movie.sinopse || 'Assista a este excelente conteúdo exclusivo na plataforma OFFRAVE.';

        let videoLink = movie.link || movie.videoUrl || 'https://lhcfadq3.sssrr.org/sora/718831616/dG8rdDhwL2cweHhETFdlMDQ2SzdLQW1NM3EvcVdTUlVNNVhqNEVvbVZ6Y1Z2dExmUUE';
        
        // Tenta enriquecer sinopse com TMDB se faltar
        try {
          const tmdbRes = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=pt-BR&query=${encodeURIComponent(movie.titulo)}`);
          const tmdbData = await tmdbRes.json();
          if (tmdbData.results && tmdbData.results.length > 0) {
            const item = tmdbData.results[0];
            if (item.overview && (!movie.sinopse || movie.sinopse.length < 10)) {
              document.getElementById('movieSynopsis').textContent = item.overview;
            }
          }
        } catch(e) {}

        videoSource.src = videoLink;
        video.load();
      } catch (err) {
        console.error("Erro ao carregar player:", err);
      }
    });
  </script>
</body>
</html>

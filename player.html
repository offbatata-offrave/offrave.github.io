<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assistir - OFFRAVE</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #08080a;
      color: #ffffff;
      min-height: 100vh;
      padding-bottom: 150px;
    }

    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(8, 8, 10, 0.98) 0%, rgba(8, 8, 10, 0.8) 70%, rgba(8, 8, 10, 0) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .brand-logo {
      font-family: 'Bebas Neue', cursive;
      font-size: 2rem;
      color: #e50914;
      text-decoration: none;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(229, 9, 20, 0.4);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-back:hover { background: rgba(255, 255, 255, 0.2); }

    .player-page-container {
      max-width: 900px;
      margin: 80px auto 20px auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .movie-details-card {
      background: rgba(18, 19, 26, 0.55);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .movie-info-header {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .movie-poster-thumb {
      width: 110px;
      height: 160px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      flex-shrink: 0;
    }

    .movie-info-text {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .movie-main-title { font-size: 1.8rem; font-weight: 800; color: #fff; line-height: 1.1; }

    .movie-category-badge {
      display: inline-block;
      background: rgba(229, 9, 20, 0.2);
      color: #e50914;
      border: 1px solid rgba(229, 9, 20, 0.4);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      width: fit-content;
      text-transform: uppercase;
    }

    .movie-synopsis {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .movie-synopsis.expanded {
      -webkit-line-clamp: unset;
    }

    .btn-read-more {
      background: none;
      border: none;
      color: #f59e0b;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      width: fit-content;
      padding: 2px 0;
      margin-top: -5px;
    }
    .btn-read-more:hover { text-decoration: underline; }

    .btn-party-sync {
      background: #6366f1;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    .btn-party-sync:hover { background: #4f46e5; transform: scale(1.02); }

    .netflix-player-container {
      position: relative;
      width: 100%;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      aspect-ratio: 16 / 9;
    }

    .netflix-video, .embedded-iframe {
      width: 100%; height: 100%; display: block; border: none; background: #000;
    }

    .movie-title-player {
      position: absolute; top: 15px; left: 20px; color: #fff; font-size: 16px; font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 5; pointer-events: none;
    }

    .bottom-nav {
      position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px);
      max-width: 450px; height: 62px; border-radius: 35px; display: flex; justify-content: space-around;
      align-items: center; z-index: 2000; background: rgba(18, 19, 26, 0.85); backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; text-decoration: none;
      font-size: 0.7rem; font-weight: 500; transition: color 0.3s; cursor: pointer; background: none; border: none;
    }
    .nav-item i { font-size: 1.15rem; }
    .nav-item:hover, .nav-item.active { color: #ffffff; }

    .loading-msg { text-align: center; color: #94a3b8; font-size: 1.1rem; margin-top: 50px; }
  </style>
</head>
<body>

  <header class='top-header'>
    <a class='brand-logo' href='index.html'>OFFRAVE</a>
    <a class='btn-back' href='index.html'><i class='fa-solid fa-arrow-left'></i> Voltar</a>
  </header>

  <div class='player-page-container' id='playerPageContent'>
    <div class='loading-msg' id='loadingMsg'><i class="fa-solid fa-spinner fa-spin"></i> Carregando...</div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i><span>Início</span></a>
    <a class="nav-item" href="index.html"><i class="fa-solid fa-tv"></i><span>Séries</span></a>
    <a class="nav-item" href="index.html"><i class="fa-solid fa-film"></i><span>Filmes</span></a>
    <a class="nav-item" href="party.html"><i class="fa-solid fa-users"></i><span>OFF Party</span></a>
  </nav>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');

    // Converte links do PixelDrain para o player embutido oficial (/v/)
    function formatVideoUrl(url) {
      if (!url) return '';
      if (url.includes('pixeldrain.com')) {
        let fileId = '';
        if (url.includes('/u/')) {
          fileId = url.split('/u/')[1].split('?')[0];
        } else if (url.includes('/api/file/')) {
          fileId = url.split('/api/file/')[1].split('?')[0];
        } else if (url.includes('/v/')) {
          fileId = url.split('/v/')[1].split('?')[0];
        }
        if (fileId) {
          return `https://pixeldrain.com/v/${fileId}`;
        }
      }
      return url;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (!movieId) {
        document.getElementById('playerPageContent').innerHTML = '<div class="loading-msg">Nenhum filme selecionado.</div>';
        return;
      }

      try {
        const res = await fetch('filmes.json');
        const movies = await res.json();
        const movie = movies.find(m => m.id === movieId);
        const container = document.getElementById('playerPageContent');

        if (!movie) {
          container.innerHTML = '<div class="loading-msg">Filme não encontrado.</div>';
          return;
        }

        let capaFinal = movie.capa || 'https://via.placeholder.com/110x160?text=Capa';
        let sinopseFinal = movie.sinopse || 'Carregando sinopse...';

        try {
          const apiKey = '6f5b9460f7c6019e38e8d79c2f5b4cf0';
          const tmdbUrl = `https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&language=pt-BR&query=${encodeURIComponent(movie.titulo)}`;
          const apiRes = await fetch(tmdbUrl);
          const apiData = await apiRes.json();

          if (apiData.results && apiData.results.length > 0) {
            const item = apiData.results[0];
            if (item.poster_path) capaFinal = `https://image.tmdb.org/t/p/w500${item.poster_path}`;
            if (item.overview) sinopseFinal = item.overview;
          }
        } catch (err) {}

        const finalUrl = formatVideoUrl(movie.videoUrl);
        const isYouTube = finalUrl.includes('youtube.com') || finalUrl.includes('youtu.be') || finalUrl.includes('embed');
        const isPixelDrain = finalUrl.includes('pixeldrain.com/v/');

        container.innerHTML = `
          <div class="netflix-player-container">
            <div class="movie-title-player">${movie.titulo}</div>

            ${isYouTube ? `
              <iframe class="embedded-iframe" src="${finalUrl.replace('watch?v=', 'embed/') + '?autoplay=1'}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            ` : isPixelDrain ? `
              <iframe class="embedded-iframe" src="${finalUrl}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
            ` : `
              <video class="netflix-video" controls autoplay playsinline src="${finalUrl}"></video>
            `}
          </div>

          <div class='movie-details-card'>
            <div class='movie-info-header'>
              <img src="${capaFinal}" alt="${movie.titulo}" class='movie-poster-thumb' onerror="this.src='https://via.placeholder.com/110x160?text=Capa'"/>
              <div class='movie-info-text'>
                <span class='movie-category-badge'>${movie.categoria}</span>
                <h1 class='movie-main-title'>${movie.titulo}</h1>
                <p class='movie-synopsis' id='movieSynopsis'>${sinopseFinal}</p>
                <button class='btn-read-more' id='readMoreBtn' onclick='toggleSynopsis()'>Ler mais</button>
              </div>
            </div>
            <a href="party.html" class='btn-party-sync'>
              <i class='fa-solid fa-users-rectangle'></i> Assistir junto no OFF Party
            </a>
          </div>
        `;

      } catch (err) {
        document.getElementById('playerPageContent').innerHTML = '<div class="loading-msg">Erro ao carregar.</div>';
      }
    });

    function toggleSynopsis() {
      const synopsis = document.getElementById('movieSynopsis');
      const btn = document.getElementById('readMoreBtn');
      synopsis.classList.toggle('expanded');
      btn.textContent = synopsis.classList.contains('expanded') ? 'Mostrar menos' : 'Ler mais';
    }
  </script>
</body>
</html>
